[project]
name = "DeepHall"
version = "0.1.0"
description = "Simulating the fractional quantum Hall effect with neural network variational Monte Carlo."
authors = [
    {name = "Yubing Qian", email="qyb@bytedance.com"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "jax>=0.4.36",
    "numpy~=2.0",
    "flax~=0.10.2",
    "kfac_jax==0.0.7",
    "omegaconf~=2.3",
    "universal_pathlib~=0.2.2",
    "folx>=0.2.19",
    "click>=8.2.1",
]

[project.scripts]
deephall = "deephall.cli:cli"

[project.entry-points."netobs.cli.expansions"]
deephall = "deephall.netobs_bridge.cli_extend:expansions"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
lint = [
    "ruff",
    "mypy",
    "pydoclint",
]
test = [
    "pytest",
    "pytest-xdist>=3.7.0",
]
dev = [
  {include-group = "lint"},
  {include-group = "test"}
]

[project.optional-dependencies]
cuda12 = ["jax[cuda12]==0.6.0"]
cuda12_local = ["jax[cuda12_local]==0.6.0"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.mypy]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
preview = true
select = [
    "F", "E", "W", # pyflakes and pycodestyle
    "D",           # pydocstyle
    "G", "LOG",    # logging rules
    "RUF",         # ruff rules
    "I",           # isort
    "CPY",         # copyright header
    "ERA",         # commented code
    "FURB", "UP",  # modernize code
    "SIM", "C90",  # simplify code
    "PLW", "PLE",  # pylint rules
]
ignore = [
    "D1",      # We will progressively add docs
    "FURB189"  # We are passing subclass of dict to OmegaConf
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# TODO: migrate to Ruff when all pydoclint rules are implemented
[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
